[project]
name = "deckforge"
version = "0.1.0"
description = "Local-first agentic presentation generation platform"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "tenacity>=9.0",
    "python-pptx>=1.0",
    "fpdf2>=2.8",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=11.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
redis = ["redis>=5.2"]
# The desktop shell uses the operating system's own webview — no Chromium is
# bundled. pythonnet is what lets pywebview drive WebView2 on Windows.
desktop = [
    "pywebview>=5.3",
    "pythonnet>=3.0; sys_platform == 'win32'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
    "PyGObject>=3.48; sys_platform == 'linux'",
]
build = ["pyinstaller>=6.11"]
# Kept out of the core dependencies so the frozen desktop bundle does not carry
# a transport it never uses.
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl",
    # The MCP tests drive a real server, so the SDK is needed to run the suite.
    "mcp>=1.2",
]

[project.scripts]
deckforge = "deckforge.cli:main"
deckforge-desktop = "deckforge.desktop.app:main"
deckforge-mcp = "deckforge.mcp:main"

[project.entry-points."deckforge.plugins"]
# Third-party packages register plugins here, e.g.:
# my_theme_pack = "my_theme_pack:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deckforge"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "PL"]
ignore = [
    "PLR0913",  # argument count is a design choice, not a defect
    "PLR0917",
    "PLR2004",
    "PLR0911",  # flat dispatch over a union beats nested indirection
    "PLR0912",
    "PLR0915",
    "PLC0415",  # local imports are used deliberately to break import cycles
    "A003",
    "B008",     # FastAPI's Depends()/File() defaults
    "RUF001",   # prose uses typographic dashes and quotes on purpose
    "RUF002",
    "RUF003",
    "UP046",    # explicit TypeVar bounds read better than PEP 695 here
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# ASYNC230/240: async tests assert against files on disk; the blocking read is
# the point, and routing it through anyio would only obscure the assertion.
"tests/*" = ["PLR2004", "S101", "E501", "ASYNC230", "ASYNC240"]
# Unbreakable data and markup: SVG path strings, sample prose, HTML fragments.
"src/deckforge/renderers/icons.py" = ["E501"]
"src/deckforge/renderers/html.py" = ["E501"]
"src/deckforge/samples.py" = ["E501"]
"src/deckforge/core/logging.py" = ["PLW0603"]
"src/deckforge/api/v1/*" = ["A002"]  # `format` is part of the public query API

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["deckforge"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

# python-pptx ships partial, sometimes inaccurate stubs (chart builders are
# untyped and shape unions are over-narrow). The exporter is covered by tests
# instead; relaxing here keeps the rest of the codebase strict.
[[tool.mypy.overrides]]
module = "deckforge.exporters.pptx_exporter"
disallow_untyped_calls = false
disable_error_code = ["attr-defined", "arg-type", "no-untyped-def", "no-any-return"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: spawns a subprocess or otherwise takes seconds rather than milliseconds",
]

[tool.coverage.run]
source = ["src/deckforge"]
